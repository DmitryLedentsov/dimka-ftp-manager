name: Android APK

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Only the newest master build should replace the rolling APK.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile and test
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: DimkaFtpManager-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
      - name: Publish standalone APK to GitHub Releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DimkaFtpManager.apk
          DESCRIPTION="Latest successful debug APK from commit ${GITHUB_SHA}. Build ${GITHUB_RUN_NUMBER}. For testing; not Play Store-signed."
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest DimkaFtpManager.apk --clobber
            gh release edit android-latest --notes "$DESCRIPTION"
          else
            gh release create android-latest DimkaFtpManager.apk \\
              --target "$GITHUB_SHA" \\
              --title "DimkaFtpManager — latest APK" \\
              --notes "$DESCRIPTION" \\
              --latest
          fi
          echo "Direct APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/android-latest/DimkaFtpManager.apk" >> "$GITHUB_STEP_SUMMARY"

